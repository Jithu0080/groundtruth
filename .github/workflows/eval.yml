# The retrieval gate. Mark "retrieval-eval" as a required check in branch protection for main.
# Check the current major versions of these actions when you set this up.
name: retrieval-eval
on:
  pull_request:
  push:
    branches: [main]

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    # The first run embeds the whole corpus on CPU (slow); later runs reuse the cache.
    timeout-minutes: 90
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Cache models and embeddings
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/embeddings
          key: emb-${{ hashFiles('data/corpus/**', 'configs/production.yaml', 'requirements.txt') }}
          # Embedding files are named by model, chunk size and corpus hash, so restoring an older cache is
          # safe: a config change reuses matching files and recomputes only what is missing.
          restore-keys: |
            emb-
      - name: Lint and type check
        run: |
          ruff check src tests
          mypy src
      - name: Validate golden set
        if: hashFiles('data/golden_v1.jsonl') != ''
        run: python -m groundtruth validate --golden data/golden_v1.jsonl
      - name: Tests + regression gate
        run: pytest -q -rs
